<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ====== META TAGS (geram o preview no WhatsApp/Discord/X) ======
     og:image e og:url são absolutas de propósito: WhatsApp e Discord
     não resolvem caminho relativo. Se o endereço do site mudar, os
     dois valores abaixo têm que mudar junto. -->
<title>Vinicios Muniz — Links</title>
<meta name="description" content="Desenvolvedor de software. Next.js, TypeScript, Node e PostgreSQL. Todos os meus links em um lugar só.">
<meta name="author" content="Vinicios Muniz">
<meta name="theme-color" content="#0B1220">
<meta property="og:type" content="profile">
<meta property="og:title" content="Vinicios Muniz — Links">
<meta property="og:description" content="Desenvolvedor de software. Next.js, TypeScript, Node e PostgreSQL.">
<meta property="og:image" content="https://viniciosmunuz.github.io/links/assets/img/og.jpg">
<meta property="og:url" content="https://viniciosmunuz.github.io/links/">
<meta name="twitter:card" content="summary_large_image">
<!-- ============================================================== -->

<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">

<script>
  // Aplica o tema antes de pintar a tela, pra não dar "flash" branco.
  (function () {
    var t = localStorage.getItem('theme');
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>

<body>
  <div class="glow glow--top" aria-hidden="true"></div>
  <div class="glow glow--bottom" aria-hidden="true"></div>

  <div class="floating-drawer" aria-label="Atalhos">
    <label class="pixel-toggle-label" for="themeToggle" title="Alternar tema">
      <input type="checkbox" id="themeToggle" class="pixel-checkbox" aria-label="Alternar tema">
      <div class="pixel-toggle-track">
        <div class="indicator-wrapper indicator-on-wrap">
          <svg viewBox="0 0 8 8" class="pixel-indicator ind-on" fill="currentColor" aria-hidden="true">
            <path d="M1,4h2v2H1zm1,1h2v2H2zm1,1h2v2H3zm1,-2h2v3H4zm1,-2h2v3H5zm1,-2h2v3H6z"></path>
          </svg>
        </div>
        <div class="indicator-wrapper indicator-off-wrap">
          <svg viewBox="0 0 8 8" class="pixel-indicator ind-off" fill="currentColor" aria-hidden="true">
            <path d="M3,3h2v2H3zM2,2h2v2H2zM1,1h2v2H1zM4,2h2v2H4zM5,1h2v2H5zM2,4h2v2H2zM1,5h2v2H1zM4,4h2v2H4zM5,5h2v2H5z"></path>
          </svg>
        </div>
        <div class="pixel-coin-thumb">
          <div class="face-svg face-sad">
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M3,2h3v1H3zm7,1h3v-1h-3z"></path>
              <path d="M4,4h2v3H4zm6,0h2v3h-2z"></path>
              <path d="M3,11h2v2H3zm8,0h2v2h-2zm-6,-2h6v2H5z"></path>
            </svg>
          </div>
          <div class="face-svg face-happy">
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M3,2h3v1H3zm7,0h3v1h-3z"></path>
              <path d="M4,4h2v3H4zm6,0h2v3h-2z"></path>
              <path d="M3,9h2v2H3zm8,0h2v2h-2zm-6,2h6v2H5z"></path>
            </svg>
          </div>
        </div>
      </div>
    </label>

  </div>

  <main class="shell">

    <!-- ---------- HEADER / PERFIL ---------- -->
    <header class="profile reveal">
      <div class="profile__avatar" id="avatar"></div>
      <div class="profile__card">
        <h1 class="profile__name" id="pName"></h1>
        <p class="profile__handle" id="pHandle"></p>

        <ul class="bio" id="pBio"></ul>

        <div class="profile__meta">
          <span class="meta">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>
            </svg>
            <span id="pLocation"></span>
          </span>
          <span class="meta__divider" aria-hidden="true"></span>
          <span class="meta">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>
            </svg>
            <span id="pJoined"></span>
          </span>
        </div>
      </div>
    </header>

    <!-- ---------- STATS SOCIAIS ---------- -->
    <section class="stats reveal" id="stats" aria-label="Redes sociais"></section>

    <!-- ---------- LINKS (grid bento) ---------- -->
    <section class="links reveal" id="links" aria-label="Meus links"></section>

    <section class="cta reveal" aria-label="Solicite um orçamento">
      <h2>Seu negócio na internet com mais clientes</h2>
      <p>Sites sob medida para o seu estabelecimento.</p>
      <a class="cta__button" href="https://wa.me/qr/CFKI7EKZUH7EK1" target="_blank" rel="noopener noreferrer">
        <svg class="cta__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3.8h9l3 3V20.2H6z"/>
          <path d="M14.8 3.8v3.4H18M9 11h6M9 14.5h4"/>
        </svg>
        <span>Pedir Orçamento</span>
      </a>
    </section>

    <footer class="footer">
      <span id="footerText"></span>
    </footer>
  </main>

  <!-- Só aparece se a página realmente tiver o que rolar; some no primeiro scroll. -->
  <button class="scroll-hint is-gone" id="scrollHint" type="button" aria-label="Ver mais abaixo">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9.5 12 15.5 18 9.5"/>
    </svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/data.js?v=9ba8c4a"></script>
  <script src="assets/js/icons.js?v=9ba8c4a"></script>
  <script src="assets/js/app.js?v=9ba8c4a"></script>
</body>
</html>
