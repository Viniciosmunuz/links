<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ====== META TAGS (geram o preview no WhatsApp/Discord/X) ======
     og:image e og:url são absolutas de propósito: WhatsApp e Discord
     não resolvem caminho relativo. Se o endereço do site mudar, os
     dois valores abaixo têm que mudar junto. -->
<title>Vinicios Muniz — Links</title>
<meta name="description" content="Desenvolvedor de software. Next.js, TypeScript, Node e PostgreSQL. Todos os meus links em um lugar só.">
<meta name="author" content="Vinicios Muniz">
<meta name="theme-color" content="#0B1220">
<meta property="og:type" content="profile">
<meta property="og:title" content="Vinicios Muniz — Links">
<meta property="og:description" content="Desenvolvedor de software. Next.js, TypeScript, Node e PostgreSQL.">
<meta property="og:image" content="https://viniciosmunuz.github.io/links/assets/img/og.jpg">
<meta property="og:url" content="https://viniciosmunuz.github.io/links/">
<meta name="twitter:card" content="summary_large_image">
<!-- ============================================================== -->

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%230593D5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">

<script>
  // Aplica o tema antes de pintar a tela, pra não dar "flash" branco.
  (function () {
    var t = localStorage.getItem('theme');
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>

<body>
  <div class="glow glow--top" aria-hidden="true"></div>
  <div class="glow glow--bottom" aria-hidden="true"></div>

  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema">
    <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
    </svg>
    <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
  </button>

  <main class="shell">

    <!-- ---------- HEADER / PERFIL ---------- -->
    <header class="profile reveal">
      <div class="profile__avatar" id="avatar"></div>
      <div class="profile__card">
        <h1 class="profile__name" id="pName"></h1>
        <p class="profile__handle" id="pHandle"></p>

        <ul class="bio" id="pBio"></ul>

        <div class="profile__meta">
          <span class="meta">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>
            </svg>
            <span id="pLocation"></span>
          </span>
          <span class="meta__divider" aria-hidden="true"></span>
          <span class="meta">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>
            </svg>
            <span id="pJoined"></span>
          </span>
        </div>
      </div>
    </header>

    <!-- ---------- STATS SOCIAIS ---------- -->
    <section class="stats reveal" id="stats" aria-label="Redes sociais"></section>

    <!-- ---------- LINKS (grid bento) ---------- -->
    <section class="links reveal" id="links" aria-label="Meus links"></section>

    <footer class="footer">
      <span id="footerText"></span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
